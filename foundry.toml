[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
# Allow gas benchmark test to write frontend/gasLimit.json
fs_permissions = [{ access = "read-write", path = "frontend" }]
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
