<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>Loading 动画 - 像素风</title>


<style>
.earth {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.earth-dust {
    position: absolute;
    width: 16px;
    height: 16px;
    background: #8b6a3a;
    border-radius: 2px;
    opacity: 0.9;
}
</style>
</head>
<body style="background-color: rgba(28, 38, 58, 0.88);"> 


<div class="monster-box">
    <img src="../../assets/aoka/aoka_golem.png" width="200">
    <div class="earth"></div>
</div>




<script>
const earth = document.querySelector('.earth');

function spawnDust() {
    const d = document.createElement("div");
    d.className = "earth-dust";

    const x = 100, y = 180; // 脚下位置
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 0;

    d.style.left = x + "px";
    d.style.top = y + "px";

    d.animate([
        { transform: "translate(0,0)", opacity: 1 },
        { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`, opacity: 0 }
    ], { duration: 600 });

    earth.appendChild(d);
    setTimeout(() => d.remove(), 600);
}

setInterval(spawnDust, 1200);
</script>


</body>
</html>
