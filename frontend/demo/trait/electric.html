<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>Loading 动画 - 像素风</title>
<style>
.monster-box {
    position: relative;
    display: inline-block;
}

.electric {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.electric-line {
    position: absolute;
    width: 2px;
    height: 40px;
    background: linear-gradient(#88ccff, #ffffff);
    opacity: 0.8;
    transform: rotate(20deg);
    filter: drop-shadow(0 0 4px #88ccff);
}
</style>

</head>
<body style="background-color: rgba(28, 38, 58, 0.88);"> 



<div class="monster-box">
    <img src="../../assets/aoka/aoka_golem.png" width="200">
    <div class="electric"></div>
</div>

<script>
const box = document.querySelector('.electric');

function spawnElectric() {
    const e = document.createElement("div");
    e.className = "electric-line";

    e.style.left = Math.random() * 180 + "px";
    e.style.top = Math.random() * 180 + "px";
    e.style.transform = `rotate(${Math.random()*60-30}deg)`;

    box.appendChild(e);

    setTimeout(() => e.remove(), 150);
}

setInterval(spawnElectric, 800);
</script>

</body>
</html>
